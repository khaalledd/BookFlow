services:
  postgres:
    restart: always
    ports: []

  redis:
    restart: always
    ports: []

  backend:
    restart: always
    environment:
      NODE_ENV: production
    # In production keep backend internal unless you explicitly need direct access.
    ports:
      - '3000:3000'

  frontend:
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - '3001:3001'
